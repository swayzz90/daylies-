<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Brain</title>
  <meta name="description" content="Nachrichten und Allgemeinwissen statt Scrollen.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-title" content="Daily Brain">
  <meta name="theme-color" content="#151A23">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preload" href="bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>html,body{background:#151A23;color-scheme:dark}</style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- Nachrichten -->
    <section class="view" id="view-news" aria-labelledby="news-title">
      <div class="pull" id="pull" aria-hidden="true"><span>Zum Aktualisieren ziehen</span></div>
      <header class="page-head">
        <h1 id="news-title">Nachrichten</h1>
        <p class="page-sub" id="news-sub">Wird geladen</p>
      </header>

      <div class="news-tools">
        <div class="segmented" role="tablist" aria-label="Bereich">
          <button role="tab" data-cat="alle" aria-selected="true">Alle</button>
          <button role="tab" data-cat="deutschland" aria-selected="false">Deutschland</button>
          <button role="tab" data-cat="welt" aria-selected="false">Welt</button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="news-search" type="search" placeholder="Meldungen durchsuchen" autocomplete="off" enterkeyhint="search">
        </label>
      </div>

      <div id="news-list" class="news-list" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </section>

    <!-- Lernen -->
    <section class="view" id="view-learn" aria-labelledby="learn-title" hidden>
      <header class="page-head">
        <h1 id="learn-title">Lernen</h1>
        <p class="page-sub" id="learn-sub"></p>
      </header>

      <div class="streak" id="streak"></div>

      <h2 class="section-title">Welt-Quiz</h2>
      <div class="chips" id="regions" role="radiogroup" aria-label="Region"></div>
      <div class="modes" id="modes"></div>

      <h2 class="section-title">Kommt als Nächstes</h2>
      <ul class="soon">
        <li><strong>Tagesstapel</strong><span>10 Wissenskarten pro Tag mit Wiederholung</span></li>
        <li><strong>Wer war das?</strong><span>Personen erraten, danach das Profil lesen</span></li>
        <li><strong>Zeitstrahl</strong><span>Ereignisse in die richtige Reihenfolge bringen</span></li>
      </ul>
    </section>
  </main>

  <!-- Quiz (Vollbild) -->
  <div class="quiz" id="quiz" hidden role="dialog" aria-modal="true" aria-label="Quiz">
    <div class="quiz-top">
      <button class="icon-btn" id="quiz-close" aria-label="Quiz beenden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <ol class="dots" id="quiz-dots" aria-label="Fortschritt"></ol>
      <span class="quiz-count" id="quiz-count"></span>
    </div>
    <div class="chips quiz-modes" id="quiz-modes" role="radiogroup" aria-label="Spiel wechseln"></div>
    <div class="quiz-body" id="quiz-body"></div>
  </div>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-tab="news" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="15" rx="2"/><path d="M16.5 8.5h3a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2h-2M7 9h6M7 12.5h6M7 16h4"/></svg>
      <span>Nachrichten</span>
    </button>
    <button data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5"/><path d="M3.5 12h17"/></svg>
      <span>Lernen</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
